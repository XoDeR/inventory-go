name: CI

# Automatic triggers are disabled; CI runs only when started manually
# (Actions tab -> CI -> "Run workflow", or `gh workflow run CI`).
# To re-enable automatic runs, uncomment the blocks below.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  extract-vars:
    name: Extract Variables from Taskfile
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.extract.outputs.GO_VERSION }}
      golangci-lint-version: ${{ steps.extract.outputs.GOLANGCI_LINT_VERSION }}
      modules: ${{ steps.extract.outputs.MODULES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Extract variables from Taskfile
        id: extract
        run: |
          chmod +x .github/scripts/extract-versions.sh
          .github/scripts/extract-versions.sh

  lint:
    needs: extract-vars
    uses: ./.github/workflows/lint-reusable.yml
    with:
      modules: ${{ needs.extract-vars.outputs.modules }}
      go-version: ${{ needs.extract-vars.outputs.go-version }}
      golangci-lint-version: ${{ needs.extract-vars.outputs.golangci-lint-version }}

  test:
    # extract-vars must be listed directly: job outputs are only visible
    # for direct dependencies
    needs: [extract-vars, lint]
    uses: ./.github/workflows/test-reusable.yml
    with:
      modules: ${{ needs.extract-vars.outputs.modules }}
      go-version: ${{ needs.extract-vars.outputs.go-version }}

  coverage:
    # Update the coverage badge only from main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [extract-vars, test]
    uses: ./.github/workflows/test-coverage-reusable.yml
    with:
      modules: ${{ needs.extract-vars.outputs.modules }}
      go-version: ${{ needs.extract-vars.outputs.go-version }}
      # Repository variable holding the ID of the Gist that stores the badge data
      gist-id: ${{ vars.COVERAGE_GIST_ID }}
    secrets:
      CODE_COVERAGE_GIST: ${{ secrets.CODE_COVERAGE_GIST }}
