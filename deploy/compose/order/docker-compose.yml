services:
  postgres-order:
    # Image, credentials and ports come from the generated .env (task env:generate)
    image: ${POSTGRES_IMAGE_NAME}
    container_name: postgres-order
    env_file:
      - .env
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

  redis-order:
    # Cache. Image and ports come from the generated .env (task env:generate)
    image: ${REDIS_IMAGE_NAME}
    container_name: redis-order
    env_file:
      - .env
    ports:
      - "${EXTERNAL_REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

volumes:
  postgres_order_data:

networks:
  microservices-net:
    # Created by deploy/compose/core (task up-core)
    external: true
