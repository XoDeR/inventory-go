version: v2
clean: true

plugins:
  - local: ../../bin/protoc-gen-go
    out: ../pkg/proto
    opt:
      - paths=source_relative
  - local: ../../bin/protoc-gen-go-grpc
    out: ../pkg/proto
    opt:
      - paths=source_relative
  - local: ../../bin/protoc-gen-grpc-gateway
    out: ../pkg/proto
    opt:
      - paths=source_relative
  - local: ../../bin/protoc-gen-validate
    out: ../pkg/proto
    opt:
      - paths=source_relative
      - lang=go
  # Own directory: `clean: true` wipes the plugin's out dir, so it must not be shared/api
  - local: ../../bin/protoc-gen-openapiv2
    out: ../api/swagger/spec
    opt:
      - json_names_for_fields=false
