syntax = "proto3";

package inventory.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "inventory-go/shared/pkg/proto/inventory/v1;inventory_v1";

// InventoryService stores and serves information about computer parts.
service InventoryService {
  // GetPart returns a part by its UUID. Returns NotFound if it does not exist.
  rpc GetPart(GetPartRequest) returns (GetPartResponse) {
    option (google.api.http) = {
      get: "/api/v1/inventory/parts/{uuid}"
    };
  }

  // ListParts returns parts matching the filter.
  // OR within a single filter field, AND between different fields.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse) {
    option (google.api.http) = {
      get: "/api/v1/inventory/parts"
    };
  }
}

// GetPartRequest is the request for InventoryService.GetPart.
message GetPartRequest {
  // Part identifier
  string uuid = 1 [(validate.rules).string.uuid = true];
}

// GetPartResponse is the response for InventoryService.GetPart.
message GetPartResponse {
  // Part information
  Part part = 1;
}

// ListPartsRequest is the request for InventoryService.ListParts.
message ListPartsRequest {
  // Parts filter (all fields are optional)
  PartsFilter filter = 1;
}

// ListPartsResponse is the response for InventoryService.ListParts.
message ListPartsResponse {
  // List of matching parts
  repeated Part parts = 1;
}

// PartsFilter: an empty field means "do not filter by this field".
message PartsFilter {
  repeated string uuids = 1 [(validate.rules).repeated.items.string.uuid = true];
  repeated string names = 2;
  repeated Category categories = 3;
  repeated string manufacturer_countries = 4;
  repeated string tags = 5;
}

// Part is a computer part stored in the inventory.
message Part {
  // Unique part identifier
  string uuid = 1;
  string name = 2;
  string description = 3;
  // Price per unit
  double price = 4;
  // Quantity in stock
  int64 stock_quantity = 5;
  Category category = 6;
  Dimensions dimensions = 7;
  Manufacturer manufacturer = 8;
  // Tags for quick search
  repeated string tags = 9;
  // Flexible metadata
  map<string, Value> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Category is the kind of a computer part.
enum Category {
  CATEGORY_UNSPECIFIED = 0; // Unspecified category
  CATEGORY_CPU = 1; // Processor
  CATEGORY_GPU = 2; // Graphics card
  CATEGORY_RAM = 3; // Memory (RAM)
  CATEGORY_STORAGE = 4; // Storage drive (SSD/HDD)
}

// Dimensions describes the physical size and weight of a part.
message Dimensions {
  // Length in cm
  double length = 1;
  // Width in cm
  double width = 2;
  // Height in cm
  double height = 3;
  // Weight in kg
  double weight = 4;
}

// Manufacturer describes the company that makes a part.
message Manufacturer {
  string name = 1;
  // Country of origin
  string country = 2;
  string website = 3;
}

// Value is a metadata value of one of the listed types.
message Value {
  oneof kind {
    string string_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}
