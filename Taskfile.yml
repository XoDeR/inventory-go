# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.12.0'
  BUF_VERSION: '1.73.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
  PROTOC_GEN_GRPC_GATEWAY_VERSION: 'v2.26.3'
  PROTOC_GEN_OPENAPIV2_VERSION: 'v2.26.3'
  PROTOC_GEN_VALIDATE_VERSION: 'v1.3.3'
  OGEN_VERSION: 'v1.24.0'
  YQ_VERSION: 'v4.54.1'
  GRPCURL_VERSION: 'v1.9.4'
  MOCKERY_VERSION: 'v2.53.3'

  MODULES: inventory order payment shared
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt{{exeExt}}'
  GCI: '{{.BIN_DIR}}/gci{{exeExt}}'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint{{exeExt}}'
  OGEN: '{{.BIN_DIR}}/ogen{{exeExt}}'
  YQ: '{{.BIN_DIR}}/yq{{exeExt}}'
  BUF: '{{.BIN_DIR}}/buf{{exeExt}}'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go{{exeExt}}'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc{{exeExt}}'
  PROTOC_GEN_GRPC_GATEWAY: '{{.BIN_DIR}}/protoc-gen-grpc-gateway{{exeExt}}'
  PROTOC_GEN_OPENAPIV2: '{{.BIN_DIR}}/protoc-gen-openapiv2{{exeExt}}'
  PROTOC_GEN_VALIDATE: '{{.BIN_DIR}}/protoc-gen-validate{{exeExt}}'
  GRPCURL: '{{.BIN_DIR}}/grpcurl{{exeExt}}'
  MOCKERY: '{{.BIN_DIR}}/mockery{{exeExt}}'

  NODE_MODULES_DIR: '{{.ROOT_DIR}}/node_modules/.bin'
  REDOCLY: '{{.NODE_MODULES_DIR}}/redocly{{if eq OS "windows"}}.cmd{{end}}'

  OPEN_API_ORDER_V1_BASE: '{{.ROOT_DIR}}/shared/api/order/v1/order.openapi.yaml'
  OPEN_API_ORDER_V1_BUNDLE: '{{.ROOT_DIR}}/shared/api/bundles/order.openapi.v1.bundle.yaml'

  OPEN_API_FILES: '{{.ROOT_DIR}}/shared/api/bundles'

tasks:
  install-formatters:
    desc: "Installs the gci and gofumpt formatters into ./bin"
    summary: |
      This task checks that the code formatting tools gofumpt and gci exist in the bin directory.
      If the tools are not found, they will be installed automatically with the specified versions.
      
      Used:
        - gofumpt: for formatting Go code
        - gci: for sorting Go imports
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Installing gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Installing gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Formats the whole project with gofumpt + gci, excluding mocks"
    summary: |
      Formats all Go files of the project using gofumpt to standardize the code
      and gci for sorting imports, excluding files in the mocks directories.
      
      Uses the tools:
        - gofumpt: for standardizing formatting
        - gci: for sorting imports by standard groups
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Formatting via gofumpt ..."
        
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🧼 Formatting $module"
            {{.GOFUMPT}} -extra -w $module
          fi
        done
      - |
        echo "🎯 Sorting imports via gci ..."
        
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🎯 Sorting imports in $module"
            {{.GCI}} write --skip-generated -s standard -s default -s "prefix(inventory-go/)" $module
          fi
        done

  install-golangci-lint:
    desc: "Installs golangci-lint into the bin directory"
    summary: |
      Checks that golangci-lint exists in the bin directory.
      If the tool is not found, installs it automatically via go install.
      
      Version to install: {{.GOLANGCI_LINT_VERSION}}
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Runs golangci-lint for all modules"
    summary: |
      Runs the golangci-lint linter for all project modules.
      The linter checks that the code conforms to quality standards and best practices.
      The check includes a security check via gosec (built into golangci-lint).
      
      Dependencies:
        - install-golangci-lint: installs the linter automatically
        - format: formats the code before checking
    deps: [ install-golangci-lint ]
    vars:
      MODULES: '{{.MODULES}}'
      GOLANGCI_LINT: '{{.GOLANGCI_LINT}}'
    cmds:
      - |
        set -e
        ERR=0
        echo "🔍 Linting all modules ..."
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🔍 Linting module $mod"
            (cd "$mod" && {{.GOLANGCI_LINT}} run ./... --config={{.ROOT_DIR}}/.golangci.yml) || ERR=1
          fi
        done
        exit $ERR

  redocly-cli:install:
    desc: Install Redocly CLI locally
    cmds:
      - |
        [ -f {{.REDOCLY}} ] || {
          npm ci
        }

  redocly-cli:order-v1-bundle:
    desc: Bundle OpenAPI into a single file via the local redocly
    deps: [ redocly-cli:install ]
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_ORDER_V1_BASE}} -o {{.OPEN_API_ORDER_V1_BUNDLE}}'

  redocly-cli:bundle:
    desc: Bundle all OpenAPI schemas into shared files via the local redocly
    deps: [ redocly-cli:install ]
    cmds:
      - task: redocly-cli:order-v1-bundle

  ogen:install:
    desc: "Downloads ogen into the bin folder"
    cmds:
      - |
        [ -f {{.OGEN}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
        }

  ogen:gen:
    desc: "Generate Go code from all OpenAPI declarations with x-ogen"
    deps: [ ogen:install, yq:install ]
    cmds:
      - task: redocly-cli:bundle
      - |
        for file in {{.OPEN_API_FILES}}/*.yaml {{.OPEN_API_FILES}}/*.yml; do
          if [ -f "$file" ] && grep -q 'x-ogen:' "$file"; then
            echo "🚀 Generating from: $file"
            target=$({{.YQ}} e '."x-ogen".target' "$file")
            package=$({{.YQ}} e '."x-ogen".package' "$file")
            echo "📁 Target: $target"
            echo "📦 Package: $package"
            {{.OGEN}} \
              --target "$target" \
              --package "$package" \
              --clean \
              "$file" || exit 1
          fi
        done

  yq:install:
    desc: "Installs yq into bin/ if needed"
    cmds:
      - |
        [ -f {{.YQ}} ] || {
          echo '📦 Installing yq...'
          GOBIN={{.BIN_DIR}} go install github.com/mikefarah/yq/v4@{{.YQ_VERSION}}
        }

  install-buf:
    desc: "Installs Buf into the bin directory"
    cmds:
      - |
        [ -f {{.BUF}} ] || {
          echo '📦 Installing buf v{{.BUF_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
        }

  proto:install-plugins:
    desc: "Installs the protoc plugins into the bin directory"
    cmds:
      - |
        [ -f {{.PROTOC_GEN_GO}} ] || {
          echo '📦 Installing protoc-gen-go...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        }
        [ -f {{.PROTOC_GEN_GO_GRPC}} ] || {
          echo '📦 Installing protoc-gen-go-grpc...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
        }
        [ -f {{.PROTOC_GEN_GRPC_GATEWAY}} ] || {
          echo '📦 Installing protoc-gen-grpc-gateway...'
          GOBIN={{.BIN_DIR}} go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@{{.PROTOC_GEN_GRPC_GATEWAY_VERSION}}
        }
        [ -f {{.PROTOC_GEN_OPENAPIV2}} ] || {
          echo '📦 Installing protoc-gen-openapiv2...'
          GOBIN={{.BIN_DIR}} go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@{{.PROTOC_GEN_OPENAPIV2_VERSION}}
        }
        [ -f {{.PROTOC_GEN_VALIDATE}} ] || {
          echo '📦 Installing protoc-gen-validate...'
          GOBIN={{.BIN_DIR}} go install github.com/envoyproxy/protoc-gen-validate@{{.PROTOC_GEN_VALIDATE_VERSION}}
        }

  proto:gen:
    deps: [ install-buf, proto:install-plugins, proto:lint ]
    desc: Generate Go code from .proto
    dir: shared/proto
    cmds:
      - '{{.BUF}} generate'

  proto:update-deps:
    deps: [ install-buf ]
    desc: Updates buf dependencies (googleapis, protoc-gen-validate) and buf.lock
    dir: shared/proto
    cmds:
      - '{{.BUF}} dep update'

  proto:lint:
    deps: [ install-buf, proto:install-plugins, proto:update-deps ]
    desc: Check .proto files for style compliance
    dir: shared/proto
    cmds:
      - '{{.BUF}} lint'

  gen:
    desc: "Generate all proto and OpenAPI declarations"
    cmds:
      - task: proto:gen
      - task: ogen:gen
    
  grpcurl:install:
    desc: "Installs grpcurl into the bin directory"
    cmds:
      - |
        [ -f {{.GRPCURL}} ] || {
          echo '📦 Installing grpcurl {{.GRPCURL_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/fullstorydev/grpcurl/cmd/grpcurl@{{.GRPCURL_VERSION}}
        }
    status:
      - test -x {{.GRPCURL}}

  mockery:install:
    desc: "Installs mockery into the bin directory"
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          echo '📦 Installing mockery {{.MOCKERY_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}

  test-api:
    desc: "🧪 Run tests to check the microservices API"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🧪 Testing the microservices API via gRPC and REST"

        # json_get KEY JSON: prints the string value of the first KEY in JSON.
        # Works on Windows (Git Bash / Task's shell) and Unix: a literal double quote is never
        # passed as a command argument (on Windows it gets mangled into \" and breaks cut),
        # so tr splits on the quote by its octal code (\042) instead.
        # Handles both compact and pretty-printed JSON: after the split the value is
        # two lines below the key line.
        json_get() {
          printf '%s' "$2" | tr -d '\r' | tr '\042' '\n' | grep -m1 -A2 -x "$1" | tail -n 1
        }

        echo "📦 Test 1: Getting the list of parts from Inventory"
        PARTS_RESPONSE=$({{.GRPCURL}} -plaintext -d '{"filter":{}}' localhost:50051 inventory.v1.InventoryService/ListParts)
        
        if [[ -z "$PARTS_RESPONSE" || "$PARTS_RESPONSE" == *"error"* ]]; then
          echo "❌ Failed to get the list of parts."
          echo "🔍 Server response: $PARTS_RESPONSE"
          exit 1
        fi
        
        # Extract the UUID of the first part for further tests
        PART_UUID=$(json_get uuid "$PARTS_RESPONSE")
        if [ -z "$PART_UUID" ]; then
          echo "❌ Failed to find the part UUID in the response."
          echo "🔍 Server response: $PARTS_RESPONSE"
          exit 1
        fi
        echo "✅ Successfully got the list of parts, first UUID: $PART_UUID"
        
        echo
        echo "🔍 Test 2: Getting part information by UUID"
        PART_RESPONSE=$({{.GRPCURL}} -plaintext -d "{\"uuid\":\"$PART_UUID\"}" localhost:50051 inventory.v1.InventoryService/GetPart)
        
        if [[ -z "$PART_RESPONSE" || "$PART_RESPONSE" == *"error"* ]]; then
          echo "❌ Failed to get the part information."
          echo "🔍 Server response: $PART_RESPONSE"
          exit 1
        fi
        
        # Extract the part name 
        PART_NAME=$(json_get name "$PART_RESPONSE")
        if [ -z "$PART_NAME" ]; then
          echo "❌ Failed to extract the part name from the response."
          echo "🔍 Server response: $PART_RESPONSE"
          exit 1
        fi
        echo "✅ Successfully got the part: $PART_NAME"
        
        echo
        echo "👤 Test 3: Creating a user for the tests"
        # Generate a unique UUID for the user
        # uuidgen is missing on Windows, fall back to the kernel (Linux) or PowerShell
        USER_UUID=$( (uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || powershell.exe -NoProfile -Command '[guid]::NewGuid().ToString()') | tr -d '\r' | tr '[:upper:]' '[:lower:]')
        echo "✅ User UUID generated: $USER_UUID"
        
        echo
        echo "📝 Test 4: Creating an order (REST API)"
        ORDER_RESPONSE=$(curl -s -X POST "http://localhost:8080/api/v1/orders" \
          -H "Content-Type: application/json" \
          -d "{\"user_uuid\":\"$USER_UUID\",\"part_uuids\":[\"$PART_UUID\"]}")
        
        if [[ -z "$ORDER_RESPONSE" || "$ORDER_RESPONSE" == *"error"* ]]; then
          echo "❌ Failed to create the order."
          echo "🔍 Server response: $ORDER_RESPONSE"
          exit 1
        fi
        
        # Extract the order UUID, taking different JSON formats into account
        ORDER_UUID=$(json_get uuid "$ORDER_RESPONSE")
        if [ -z "$ORDER_UUID" ]; then
          echo "❌ Failed to extract the order UUID from the response."
          echo "🔍 Server response: $ORDER_RESPONSE"
          exit 1
        fi
        echo "✅ Successfully created the order with UUID: $ORDER_UUID"
        
        echo
        echo "📊 Test 5: Checking the initial order status (should be PENDING_PAYMENT)"
        ORDER_INFO_RESPONSE=$(curl -s -X GET "http://localhost:8080/api/v1/orders/$ORDER_UUID")
        
        if [[ -z "$ORDER_INFO_RESPONSE" || "$ORDER_INFO_RESPONSE" == *"error"* ]]; then
          echo "❌ Failed to get the order information."
          echo "🔍 Server response: $ORDER_INFO_RESPONSE"
          exit 1
        fi
        
        # Extract the order status, taking different JSON formats into account
        ORDER_STATUS=$(json_get status "$ORDER_INFO_RESPONSE")
        if [ -z "$ORDER_STATUS" ]; then
          echo "❌ Failed to extract the order status from the response."
          echo "🔍 Server response: $ORDER_INFO_RESPONSE"
          exit 1
        fi
        
        # Check that the initial status is PENDING_PAYMENT
        if [[ "$ORDER_STATUS" != *"PENDING_PAYMENT"* ]]; then
          echo "❌ Wrong initial order status. Expected PENDING_PAYMENT, got: $ORDER_STATUS"
          exit 1
        fi
        echo "✅ Initial order status is correct: $ORDER_STATUS"
        
        echo
        echo "💰 Test 6: Paying for the order (REST API)"
        PAY_RESPONSE=$(curl -s -X POST "http://localhost:8080/api/v1/orders/$ORDER_UUID/pay" \
          -H "Content-Type: application/json" \
          -d "{\"payment_method\":\"CARD\"}")
        
        if [[ "$PAY_RESPONSE" == *"error"* ]]; then
          echo "❌ Error while paying for the order."
          echo "🔍 Server response: $PAY_RESPONSE"
          exit 1
        fi
        echo "✅ Order paid successfully"
        
        echo
        echo "📊 Test 7: Checking the status after payment (should be PAID)"
        ORDER_INFO_RESPONSE=$(curl -s -X GET "http://localhost:8080/api/v1/orders/$ORDER_UUID")
        
        # Extract the order status
        ORDER_STATUS=$(json_get status "$ORDER_INFO_RESPONSE")
        
        # Check that the status became PAID
        if [[ "$ORDER_STATUS" != *"PAID"* && "$ORDER_STATUS" != *"ASSEMBLED"* ]]; then
          echo "❌ Wrong order status after payment. Expected PAID or ASSEMBLED, got: $ORDER_STATUS"
          exit 1
        fi
        echo "✅ Order status after payment: $ORDER_STATUS"
        
        echo
        echo "📝 Test 8: Creating a second order to cancel (REST API)"
        ORDER2_RESPONSE=$(curl -s -X POST "http://localhost:8080/api/v1/orders" \
          -H "Content-Type: application/json" \
          -d "{\"user_uuid\":\"$USER_UUID\",\"part_uuids\":[\"$PART_UUID\"]}")
        
        if [[ -z "$ORDER2_RESPONSE" || "$ORDER2_RESPONSE" == *"error"* ]]; then
          echo "❌ Failed to create the second order."
          echo "🔍 Server response: $ORDER2_RESPONSE"
          exit 1
        fi
        
        # Extract the UUID of the second order, taking different JSON formats into account
        ORDER2_UUID=$(json_get uuid "$ORDER2_RESPONSE")
        if [ -z "$ORDER2_UUID" ]; then
          echo "❌ Failed to extract the UUID of the second order from the response."
          echo "🔍 Server response: $ORDER2_RESPONSE"
          exit 1
        fi
        echo "✅ Successfully created the second order with UUID: $ORDER2_UUID"
        
        # Check its initial status
        ORDER2_INFO=$(curl -s -X GET "http://localhost:8080/api/v1/orders/$ORDER2_UUID")
        ORDER2_STATUS=$(json_get status "$ORDER2_INFO")

        if [[ "$ORDER2_STATUS" != *"PENDING_PAYMENT"* ]]; then
          echo "❌ Wrong initial status of the second order. Expected PENDING_PAYMENT, got: $ORDER2_STATUS"
          exit 1
        fi
        echo "✅ Initial status of the second order: $ORDER2_STATUS"
        
        echo
        echo "❌ Test 9: Cancelling the second order (REST API)"
        echo "Waiting 2 seconds before cancelling..."
        sleep 2
        
        curl -s -X POST "http://localhost:8080/api/v1/orders/$ORDER2_UUID/cancel"
        
        echo "Checking the status after cancellation..."
        
        ORDER2_INFO=$(curl -s -X GET "http://localhost:8080/api/v1/orders/$ORDER2_UUID")
        ORDER2_STATUS=$(json_get status "$ORDER2_INFO")

        if [[ "$ORDER2_STATUS" != *"CANCELLED"* ]]; then
          echo "❌ Wrong status of the cancelled order. Expected CANCELLED, got: $ORDER2_STATUS"
          echo "🔍 Order details: $ORDER2_INFO"
          exit 1
        fi
        echo "✅ Status of the second order after cancellation: $ORDER2_STATUS"
        
        echo
        echo "🎉 All API tests completed successfully!"



